name: iTry CI
on:
  push:
    branches: ['feature/itry-foundation']
    paths: ['apps/itry/**']
  pull_request:
    paths: ['apps/itry/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/itry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
