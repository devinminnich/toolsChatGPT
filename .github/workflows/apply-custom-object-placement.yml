name: Apply custom object placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-custom-object-placement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update custom object creation flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/PersistentPlanner.tsx')
          text = path.read_text()

          old = """      xMm: Math.round(roomBounds.minX + roomWidth / 2 - widthMm / 2),\n      yMm: Math.round(roomBounds.minY + roomDepth / 2 - depthMm / 2),"""
          new = """      xMm: Math.round(view.x + view.width / 2 - widthMm / 2),\n      yMm: Math.round(view.y + view.height / 2 - depthMm / 2),"""
          if old not in text:
              raise SystemExit('custom object placement anchor not found')
          text = text.replace(old, new, 1)

          old = """            <div className=\"field-grid\">\n              <label><span>X position</span><input key={`${selectedFixture.id}-x-${selectedFixture.xMm}-${unit}`} defaultValue={valueForCoordinateInput(selectedFixture.xMm, unit)} onBlur={(event) => updateFixtureCoordinate('xMm', event.target.value)} /></label>\n              <label><span>Y position</span><input key={`${selectedFixture.id}-y-${selectedFixture.yMm}-${unit}`} defaultValue={valueForCoordinateInput(selectedFixture.yMm, unit)} onBlur={(event) => updateFixtureCoordinate('yMm', event.target.value)} /></label>\n              <label><span>Width</span><input key={`${selectedFixture.id}-w-${selectedFixture.widthMm}-${unit}`} defaultValue={valueForInput(selectedFixture.widthMm, unit)} onBlur={(event) => updateFixtureDimension('widthMm', event.target.value)} /></label>\n              <label><span>Depth</span><input key={`${selectedFixture.id}-d-${selectedFixture.depthMm}-${unit}`} defaultValue={valueForInput(selectedFixture.depthMm, unit)} onBlur={(event) => updateFixtureDimension('depthMm', event.target.value)} /></label>\n              <label><span>Rotation (degrees)</span><input inputMode=\"decimal\" key={`${selectedFixture.id}-r-${selectedFixture.rotationDeg}`} defaultValue={String(selectedFixture.rotationDeg)} onBlur={(event) => updateFixtureRotation(event.target.value)} /></label>\n            </div>"""
          new = """            <p className=\"helper\">Drag this object on the drawing to place it. Use Precision only when you want exact coordinates.</p>\n            <div className=\"field-grid\">\n              <label><span>Width</span><input key={`${selectedFixture.id}-w-${selectedFixture.widthMm}-${unit}`} defaultValue={valueForInput(selectedFixture.widthMm, unit)} onBlur={(event) => updateFixtureDimension('widthMm', event.target.value)} /></label>\n              <label><span>Depth</span><input key={`${selectedFixture.id}-d-${selectedFixture.depthMm}-${unit}`} defaultValue={valueForInput(selectedFixture.depthMm, unit)} onBlur={(event) => updateFixtureDimension('depthMm', event.target.value)} /></label>\n              <label><span>Rotation (degrees)</span><input inputMode=\"decimal\" key={`${selectedFixture.id}-r-${selectedFixture.rotationDeg}`} defaultValue={String(selectedFixture.rotationDeg)} onBlur={(event) => updateFixtureRotation(event.target.value)} /></label>\n            </div>\n            <details className=\"precision-details\">\n              <summary>Precision</summary>\n              <div className=\"field-grid\">\n                <label><span>X position</span><input key={`${selectedFixture.id}-x-${selectedFixture.xMm}-${unit}`} defaultValue={valueForCoordinateInput(selectedFixture.xMm, unit)} onBlur={(event) => updateFixtureCoordinate('xMm', event.target.value)} /></label>\n                <label><span>Y position</span><input key={`${selectedFixture.id}-y-${selectedFixture.yMm}-${unit}`} defaultValue={valueForCoordinateInput(selectedFixture.yMm, unit)} onBlur={(event) => updateFixtureCoordinate('yMm', event.target.value)} /></label>\n              </div>\n            </details>"""
          if old not in text:
              raise SystemExit('selected object editor anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('It will appear centered in the room, ready to drag into place.', 'It will appear in the center of your current view, ready to drag into place.', 1)
          path.write_text(text)

          custom_test = Path('e2e/custom-object.e2e.ts')
          tests = custom_test.read_text()
          tests = tests.replace("test('creates a named custom object centered in the room without asking for placement coordinates'", "test('creates a named custom object in the current view without requiring placement coordinates'", 1)
          old_assert = """  const x = Number(await properties.getByLabel('X position').inputValue());\n  const y = Number(await properties.getByLabel('Y position').inputValue());\n  expect(x).toBeCloseTo(71, 1);\n  expect(y).toBeCloseTo(37, 1);"""
          new_assert = """  await expect(properties.getByText(/Drag this object on the drawing to place it/)).toBeVisible();\n  await expect(properties.getByLabel('X position')).not.toBeVisible();\n  await expect(properties.getByLabel('Y position')).not.toBeVisible();\n  await properties.getByText('Precision', { exact: true }).click();\n  await expect(properties.getByLabel('X position')).toBeVisible();\n  await expect(properties.getByLabel('Y position')).toBeVisible();"""
          if old_assert not in tests:
              raise SystemExit('custom object test anchor not found')
          custom_test.write_text(tests.replace(old_assert, new_assert, 1))
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -q "center of your current view" src/PersistentPlanner.tsx
          grep -q "Drag this object on the drawing to place it" src/PersistentPlanner.tsx
          grep -q "Precision" e2e/custom-object.e2e.ts
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx e2e/custom-object.e2e.ts
          git commit -m "Center custom objects in view and favor drag placement"
          git push origin main
