name: Apply room redraw toolbar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-room-redraw-toolbar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/add_room_redraw_toolbar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx
          git commit -m "Keep room redraw control visible"
          git push origin main
