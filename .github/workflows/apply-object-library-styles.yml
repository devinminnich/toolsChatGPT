name: Apply object library styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-object-library-styles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/style_object_library.py
      - run: |
          git diff --check
          grep -q "object-library-sheet" src/styles.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          git commit -m "Style default object library"
          git push origin main
