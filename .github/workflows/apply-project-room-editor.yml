name: Apply project room editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-project-room-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply project-level room editor patch
        run: python .github/scripts/apply_project_room_editor.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "roomEditing" src/PersistentPlanner.tsx
          grep -q "room-locked" src/styles.css
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx src/styles.css
          git commit -m "Move room editing to project-level flow"
          git push origin main
