name: Apply draw controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-draw-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add draw correction controls and browser coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          planner_path = Path('src/PersistentPlanner.tsx')
          planner = planner_path.read_text()

          old = """  function beginDraw() {\n    setDraft([]);\n    setSelectedFixtureId(null);\n    setSelectedWall(null);\n    setMode('draw');\n  }\n\n  function canvasPointerDown"""
          new = """  function beginDraw() {\n    setDraft([]);\n    setSelectedFixtureId(null);\n    setSelectedWall(null);\n    setMode('draw');\n  }\n\n  function undoLastDraftLine() {\n    setDraft((points) => points.length > 1 ? points.slice(0, -1) : points);\n  }\n\n  function clearDraft() {\n    setDraft([]);\n  }\n\n  function canvasPointerDown"""
          if old not in planner:
              raise SystemExit('beginDraw anchor not found')
          planner = planner.replace(old, new, 1)

          old_toolbar = """          <div className=\"canvas-toolbar\">\n            <span>{formatMeasurement(roomWidth, unit)} × {formatMeasurement(roomDepth, unit)} envelope</span>\n            <div className=\"canvas-controls\"><button onClick={() => fitToView()}>Fit</button></div>\n          </div>"""
          new_toolbar = """          <div className=\"canvas-toolbar\">\n            <span>{mode === 'draw' ? `${Math.max(0, draft.length - 1)} drawn line${draft.length === 2 ? '' : 's'}` : `${formatMeasurement(roomWidth, unit)} × ${formatMeasurement(roomDepth, unit)} envelope`}</span>\n            <div className=\"canvas-controls\">\n              {mode === 'draw' && <>\n                <button type=\"button\" onClick={undoLastDraftLine} disabled={draft.length < 2}>Undo line</button>\n                <button type=\"button\" onClick={clearDraft} disabled={draft.length === 0}>Clear</button>\n              </>}\n              <button type=\"button\" onClick={() => fitToView()}>Fit</button>\n            </div>\n          </div>"""
          if old_toolbar not in planner:
              raise SystemExit('canvas toolbar anchor not found')
          planner = planner.replace(old_toolbar, new_toolbar, 1)
          planner_path.write_text(planner)

          test_path = Path('e2e/drawing-controls.e2e.ts')
          test_path.write_text("""import { expect, test } from '@playwright/test';\n\ntest.beforeEach(async ({ page }) => {\n  await page.goto('/');\n  await page.evaluate(() => localStorage.clear());\n  await page.reload();\n  await expect(page.getByLabel('Current renovation project')).toBeVisible();\n});\n\ntest('undoes and clears drawn wall segments', async ({ page, isMobile }) => {\n  await page.getByRole('button', { name: isMobile ? 'Draw' : 'Draw walls', exact: true }).click();\n\n  const canvas = page.locator('.design-canvas');\n  await canvas.click({ position: { x: 90, y: 120 } });\n  await canvas.click({ position: { x: 180, y: 120 } });\n  await expect(page.locator('.draft-shape circle')).toHaveCount(2);\n  await expect(page.getByRole('button', { name: 'Undo line' })).toBeEnabled();\n\n  await page.getByRole('button', { name: 'Undo line' }).click();\n  await expect(page.locator('.draft-shape circle')).toHaveCount(1);\n\n  await page.getByRole('button', { name: 'Clear' }).click();\n  await expect(page.locator('.draft-shape')).toHaveCount(0);\n});\n""")
          PY
      - name: Validate patch
        run: |
          git diff --check
          test -f e2e/drawing-controls.e2e.ts
          grep -q "Undo line" src/PersistentPlanner.tsx
          grep -q "Clear" src/PersistentPlanner.tsx
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx e2e/drawing-controls.e2e.ts
          git commit -m "Add draw line undo and clear controls"
          git push origin main
