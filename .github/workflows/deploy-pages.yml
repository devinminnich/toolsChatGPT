name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live app shell and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page="$(mktemp)"
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o "$page"
          grep -q '<div id="root"></div>' "$page"
          asset="$(grep -oE 'src="[^"]+assets/index-[^"]+\.js"' "$page" | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          if [[ "$asset" = /* ]]; then
            origin="$(printf '%s' "$PAGE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            asset_url="$origin$asset"
          else
            asset_url="${PAGE_URL%/}/$asset"
          fi
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$asset_url" -o /dev/null
