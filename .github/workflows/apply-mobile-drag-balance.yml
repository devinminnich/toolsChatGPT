name: Apply mobile drag balance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-drag-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebalance mobile drag targets
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path('src/PersistentPlanner.tsx')
          text = planner.read_text()

          old = '''              return <g key={fixture.id} transform={`rotate(${fixture.rotationDeg} ${cx} ${cy})`} className={`fixture ${fixture.id === selectedFixtureId ? 'selected' : ''}`} onPointerDown={(event) => startFixtureDrag(event, fixture)} onPointerMove={moveFixture} onPointerUp={stopDrag} onPointerCancel={stopDrag}>\n                <rect x={fixture.xMm} y={fixture.yMm} width={fixture.widthMm} height={fixture.depthMm} rx="35" />'''
          new = '''              const touchPad = Math.max(inchesToMm(3), Math.min(inchesToMm(6), Math.min(fixture.widthMm, fixture.depthMm) * 0.25));\n              return <g key={fixture.id} transform={`rotate(${fixture.rotationDeg} ${cx} ${cy})`} className={`fixture ${fixture.id === selectedFixtureId ? 'selected' : ''}`} onPointerDown={(event) => startFixtureDrag(event, fixture)} onPointerMove={moveFixture} onPointerUp={stopDrag} onPointerCancel={stopDrag}>\n                <rect className="fixture-hitbox" x={fixture.xMm - touchPad} y={fixture.yMm - touchPad} width={fixture.widthMm + touchPad * 2} height={fixture.depthMm + touchPad * 2} rx="70" />\n                <rect className="fixture-shape" x={fixture.xMm} y={fixture.yMm} width={fixture.widthMm} height={fixture.depthMm} rx="35" />'''
          if old not in text:
              raise SystemExit('fixture render anchor not found')
          text = text.replace(old, new, 1)
          planner.write_text(text)

          styles = Path('src/styles.css')
          css = styles.read_text()
          css = css.replace('.fixture rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 6; vector-effect: non-scaling-stroke; }', '.fixture .fixture-hitbox { fill: transparent; stroke: none; pointer-events: all; }\n.fixture .fixture-shape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 6; vector-effect: non-scaling-stroke; pointer-events: all; }', 1)
          css = css.replace('.fixture.selected rect { fill: #c8eee7; stroke: var(--navy); stroke-width: 9; }', '.fixture.selected .fixture-shape { fill: #c8eee7; stroke: var(--navy); stroke-width: 9; }', 1)
          css = css.replace('  .vertex-handle { r: 70px; }', '  .vertex-handle { r: 38px; }', 1)
          css = css.replace('  .fixture:hover rect { stroke: #087d6f; }', '  .fixture:hover .fixture-shape { stroke: #087d6f; }', 1)
          styles.write_text(css)

          test_path = Path('e2e/custom-object.e2e.ts')
          tests = test_path.read_text()
          addition = r'''

test('gives fixtures a larger invisible drag target than their visible box', async ({ page, isMobile }) => {
  await page.getByRole('button', { name: isMobile ? '+ Object' : '+ Custom object', exact: true }).click();
  const dialog = page.getByRole('dialog', { name: 'Create custom object' });
  await dialog.getByLabel('Custom object name').fill('Touch target test');
  await dialog.getByLabel('Custom object width').fill('12');
  await dialog.getByLabel('Custom object depth').fill('12');
  await dialog.getByRole('button', { name: 'Create object' }).click();

  const fixture = page.locator('.fixture.selected');
  const visible = fixture.locator('.fixture-shape');
  const hitbox = fixture.locator('.fixture-hitbox');
  await expect(hitbox).toHaveCount(1);

  const visibleWidth = Number(await visible.getAttribute('width'));
  const visibleHeight = Number(await visible.getAttribute('height'));
  const hitWidth = Number(await hitbox.getAttribute('width'));
  const hitHeight = Number(await hitbox.getAttribute('height'));
  expect(hitWidth).toBeGreaterThan(visibleWidth);
  expect(hitHeight).toBeGreaterThan(visibleHeight);
});
'''
          if 'gives fixtures a larger invisible drag target' not in tests:
              test_path.write_text(tests.rstrip() + addition + '\n')
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'fixture-hitbox' src/PersistentPlanner.tsx
          grep -q 'r: 38px' src/styles.css
          grep -q 'larger invisible drag target' e2e/custom-object.e2e.ts
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx src/styles.css e2e/custom-object.e2e.ts
          git commit -m "Rebalance mobile room and object dragging"
          git push origin main
