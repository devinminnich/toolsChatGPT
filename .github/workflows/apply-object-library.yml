name: Apply object library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-object-library.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire object library into planner
        run: python .github/scripts/wire_object_library.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "OBJECT_PRESETS" src/PersistentPlanner.tsx
          grep -q "Object library" src/PersistentPlanner.tsx
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersistentPlanner.tsx
          git commit -m "Expose default home object library"
          git push origin main
